<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirai</title>
    <link rel="icon" type="image/png" href="/icons/icon_mirai_app.png" />
    <script>
      {
        let theme = "system";
        try {
          const stored = JSON.parse(
            localStorage.getItem("mirai-store") || localStorage.getItem("mirai-electron-store") || "{}",
          )?.state;
          theme = ["system", "light", "dark"].includes(stored?.theme)
            ? stored.theme
            : stored?.isDarkMode === false
              ? "light"
              : "system";
        } catch {}
        const isDark =
          theme === "dark" ||
          (theme === "system" && (window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? false));
        document.documentElement.classList.toggle("dark", isDark);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
