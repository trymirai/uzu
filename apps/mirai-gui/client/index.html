<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirai</title>
    <link rel="icon" type="image/png" href="/icons/icon_mirai_app.png" />
    <script>
      {
        let isDark = true;
        try {
          isDark = JSON.parse(localStorage.getItem("mirai-store") ?? "{}")?.state?.isDarkMode !== false;
        } catch {
          isDark = true;
        }
        document.documentElement.classList.toggle("dark", isDark);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
