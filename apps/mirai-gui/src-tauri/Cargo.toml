[package]
name = "mirai-gui"
version = "0.4.10"
edition = "2024"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
gcp_auth = "0.12"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Metal backend only, no grammar (heavy C++ xgrammar).
uzu = { path = "../../../crates/legacy/uzu", default-features = false, features = ["backend-metal"] }
hanashi = { path = "../../../crates/legacy/hanashi", default-features = false }

# Metal shader compilation in backend-uzu's build script is unbearably slow
# without optimized build scripts.
[profile.dev.build-override]
opt-level = 3
