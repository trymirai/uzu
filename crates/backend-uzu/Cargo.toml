[package]
name = "backend-uzu"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
build = "build/main.rs"

[lints]
workspace = true

[features]
default = ["cpu", "metal", "grammar"]

cpu = []

metal = [
    "dep:clang-ast",
    "dep:tempfile",
    "dep:serde_json",
    "dep:objc2",
    "dep:obfstr",
    "dep:zstd",
    "dep:metal",
]

grammar = ["dep:xgrammar", "dep:schemars"]

[build-dependencies]
anyhow.workspace = true
async-trait.workspace = true
bindgen.workspace = true
walkdir.workspace = true
depfile.workspace = true
derive_more.workspace = true
serde.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["full"] }
blake3.workspace = true
quote.workspace = true
proc-macro2.workspace = true
syn.workspace = true
prettyplease.workspace = true
itertools.workspace = true
rhai.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos"))'.build-dependencies]
clang-ast = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
serde_json = { workspace = true, features = ["unbounded_depth"], optional = true }
zstd = { workspace = true, optional = true }

[dependencies]
proc-macros.workspace = true
bitflags.workspace = true
derive_more.workspace = true
shoji.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true
monostate.workspace = true
thiserror.workspace = true
tokenizers.workspace = true
rangemap.workspace = true
bytemuck = { workspace = true, features = ["derive"] }
xxhash-rust = { workspace = true, features = ["xxh3"] }
memmap2.workspace = true
num-traits.workspace = true
libm.workspace = true
rand.workspace = true
itertools.workspace = true
rustix.workspace = true
futures.workspace = true
parking_lot = { workspace = true, features = ["send_guard"] }
tokio-util.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "tvos", target_os = "visionos"))'.dependencies]
objc2 = { workspace = true, optional = true }
obfstr = { workspace = true, optional = true }
zstd = { workspace = true, optional = true }
metal = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
xgrammar = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
test-tag.workspace = true
test-runner = { workspace = true, features = ["nightly-harness"] }
proptest.workspace = true
criterion.workspace = true
rand_distr.workspace = true
is_close.workspace = true
ndarray.workspace = true
rstest.workspace = true
tempfile.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { workspace = true, default-features = true }
proptest = { workspace = true, default-features = true }
