[package]
name = "cli-tools"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "cli-tools"
path = "src/main.rs"

[features]
default = ["backend-cpu", "backend-metal", "capability-grammar"]
backend-cpu = ["uzu-engine/cpu"]
backend-metal = ["uzu-engine/metal"]
capability-grammar = ["uzu-engine/grammar"]

[dependencies]
clap.workspace = true
ignore.workspace = true
itertools.workspace = true
walkdir.workspace = true
heck.workspace = true
syn.workspace = true
serde.workspace = true
toml.workspace = true
toml_edit.workspace = true
regex.workspace = true
download-manager.workspace = true
futures-util.workspace = true
kiban.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokenizers.workspace = true
serde_json.workspace = true
minijinja.workspace = true
anyhow.workspace = true
indexmap.workspace = true
colored.workspace = true
uzu-engine.workspace = true
sysinfo.workspace = true
parquet.workspace = true

[lints]
workspace = true
