[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste - no longer maintained
    "RUSTSEC-2024-0384", # instant is unmaintained
    "RUSTSEC-2025-0012", # backoff is unmaintained
    "RUSTSEC-2026-0249", # smartstring is unmaintained
    "RUSTSEC-2026-0258", # Rocket 0.5.1 uses h2 0.3.x
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Apache-2.0",
    "MPL-2.0",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Unicode-3.0",
    "NCSA",
]

[bans]
multiple-versions = "allow"

[sources.allow-org]
github = ["trymirai"]
