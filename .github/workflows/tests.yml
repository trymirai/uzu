name: "Tests"

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # For pipefail - https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#exit-codes-and-error-action-preference
    shell: bash

jobs:
  linters:
    name: linters
    runs-on: prefect-github-actions
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup-nix

      - name: Check that Cargo.lock is consistent with Cargo.toml
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Check uzu-engine rustfmt discovery
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: RUSTUP_TOOLCHAIN=nightly ./scripts/check-rustfmt-discovery.sh

      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo +nightly fmt --check

      - name: Check Metal formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./scripts/clang-format.sh --check

      - name: Lint with clippy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo +nightly clippy --workspace --all-targets --features uzu-engine/webgpu -- -D warnings

      - name: Check with cargo-deny
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo deny --exclude mirai-gui check -D warnings

      - name: Check sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: cargo tools sync --check

      - name: Check working tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: git diff --exit-code

  tests:
    name: ${{ matrix.host }}${{ matrix.backend && format(' ({0})', matrix.backend) }}${{ matrix.target && format(' ({0})', matrix.target) }}
    runs-on: ${{ matrix.host == 'linux' && 'uzu-n4std16' || 'prefect-github-actions' }}
    timeout-minutes: 120

    strategy:
      matrix:
        include:
          - host: 'macos'
            backend: 'metal'
            tests: true
            benches: true
          - host: 'macos'
            backend: 'webgpu'
            tests: true
            benches: true
            crates: ['uzu-engine']
            no-default-features: true
            features: ['uzu-engine/webgpu', 'uzu-engine/cpu']
          - host: 'linux'
            crates: ['cli']
          - host: 'linux'
            target: 'wasm32-unknown-unknown'
            crates: ['uzu']
            no-default-features: true
            features: ['uzu/webgpu']

    env:
      CARGO_ENCODED_RUSTFLAGS: "-Dwarnings"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup-nix

      - name: Check that Cargo.lock is consistent with Cargo.toml
        run: cargo metadata --locked --format-version=1 > /dev/null

      - name: Download test data
        if: ${{ matrix.tests == true }}
        run: cargo tools hanashi-tokenizers

      - name: Build crates
        run: |
          cargo +stable build \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }} \
            ${{ matrix.no-default-features && '--no-default-features' || '' }} \
            ${{ matrix.features && format('--features {0}', join(matrix.features, ',')) || '' }} \
            ${{ matrix.crates && format('-p {0}', join(matrix.crates, ' -p ')) || '' }}

      - name: Build benches
        if: ${{ matrix.benches }}
        run: |
          cargo +nightly bench --no-run \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }} \
            ${{ matrix.no-default-features && '--no-default-features' || '' }} \
            ${{ matrix.features && format('--features {0}', join(matrix.features, ',')) || '' }} \
            ${{ matrix.crates && format('-p {0}', join(matrix.crates, ' -p ')) || '' }}

      - name: Run tests
        if: ${{ matrix.tests }}
        run: |
          cargo +nightly nextest run --profile=ci \
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }} \
            ${{ matrix.no-default-features && '--no-default-features' || '' }} \
            ${{ matrix.features && format('--features {0}', join(matrix.features, ',')) || '' }} \
            ${{ matrix.crates && format('-p {0}', join(matrix.crates, ' -p ')) || '' }}

      - name: Check working tree
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: git diff --exit-code

  vulkan:
    name: vulkan
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix
      - name: Use lavapipe
        run: |
          mesa=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa)
          drivers=("$mesa"/share/vulkan/icd.d/lvp_icd*.json)
          test "${#drivers[@]}" -eq 1 && test -f "${drivers[0]}"
          echo "VK_DRIVER_FILES=${drivers[0]}" >> "$GITHUB_ENV"
      - name: Lint Vulkan
        run: cargo +nightly clippy -p uzu-engine --no-default-features --features cpu,vulkan --lib --tests --locked -- -D warnings
      - name: Test CPU and Vulkan contracts
        run: cargo +nightly test -p uzu-engine --no-default-features --features cpu,vulkan --lib --locked

  validate-bindings:
    name: validate-bindings
    runs-on: prefect-github-actions
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix

      - name: "Verify"
        id: verify
        run: |
          cargo tools verify

      - name: "Print diff"
        if: ${{ always() && steps.verify.outcome == 'failure' }}
        run: git diff

      - name: "Test"
        run: |
          cargo tools test python
          cargo tools test swift
          cargo tools test typescript

  linters-mirai-gui:
    name: linters (mirai-gui)
    runs-on: prefect-github-actions
    timeout-minutes: 120

    defaults:
      run:
        working-directory: apps/mirai-gui

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix

      - id: install
        name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm format:check

      - name: Check with cargo-deny
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/mirai-gui/desktop
        run: cargo deny check -D warnings

  tests-mirai-gui:
    name: tests (mirai-gui)
    runs-on: prefect-github-actions
    timeout-minutes: 120

    defaults:
      run:
        working-directory: apps/mirai-gui

    env:
      CARGO_ENCODED_RUSTFLAGS: "-Dwarnings"

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run client tests
        run: pnpm test

  build-mirai-gui:
    name: build (mirai-gui)
    runs-on: prefect-github-actions
    timeout-minutes: 120

    defaults:
      run:
        working-directory: apps/mirai-gui

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundle
        run: pnpm build --target aarch64-apple-darwin

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: mirai-gui-macos-arm64
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-uzu-pi-extension:
    name: check and build (uzu-pi-extension)
    runs-on: prefect-github-actions
    timeout-minutes: 120

    defaults:
      run:
        working-directory: apps/uzu-pi-extension

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-nix

      - name: Build monorepo bindings
        working-directory: crates/legacy/uzu/bindings/typescript
        env:
          MIRAI_DISABLE_DENO_BUILD: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm exec napi build --manifest-path ../../Cargo.toml --no-default-features --features metal,bindings-napi --platform --output-dir src/napi
          pnpm build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test and build
        run: pnpm check

      - name: Check package
        run: |
          pnpm --dir dist pack
          node scripts/check-package.mjs

      - name: Upload extension package
        uses: actions/upload-artifact@v7
        with:
          name: uzu-pi-extension
          path: apps/uzu-pi-extension/dist/*.tgz
          if-no-files-found: error

  completed:
    name: completed
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: [linters, tests, vulkan, validate-bindings, linters-mirai-gui, tests-mirai-gui, build-mirai-gui, build-uzu-pi-extension]
    if: ${{ always() }}

    steps:
      - run: |
          [ "${{ needs.linters.result }}" = success ]
          [ "${{ needs.tests.result }}" = success ]
          [ "${{ needs.vulkan.result }}" = success ]
          [ "${{ needs.validate-bindings.result }}" = success ]
          [ "${{ needs.linters-mirai-gui.result }}" = success ]
          [ "${{ needs.tests-mirai-gui.result }}" = success ]
          [ "${{ needs.build-mirai-gui.result }}" = success ]
          [ "${{ needs.build-uzu-pi-extension.result }}" = success ]
