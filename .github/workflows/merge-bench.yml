name: "Merge benchmark"

on:
  push:
    branches:
      - main
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  merge-bench:
    name: Benchmark against the fork point
    if: >-
      ${{
        github.event_name == 'push' ||
        (github.event.issue.pull_request &&
          (github.event.comment.body == '!bench' || startsWith(github.event.comment.body, '!bench ')))
      }}
    # Not a fleet Mac: it would wait on benchmarks that wait on it.
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: prefect-benchmarks

    steps:
      - name: Find what to benchmark
        id: revisions
        env:
          COMMENT: ${{ github.event.comment.id }}
          COMMENTER: ${{ github.event.comment.user.login }}
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.issue.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            merged="first(.[] | select(.merge_commit_sha == \"$GITHUB_SHA\") | .number)"
            {
              echo "source=$GITHUB_SHA"
              echo "destination=HEAD^"
              echo "target=$GITHUB_REF_NAME"
              echo "pull_request=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq "$merged")"
            } >> "$GITHUB_OUTPUT"
            exit
          fi
          permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" --jq .permission)"
          if [[ "$permission" != admin && "$permission" != write ]]; then
            echo "::error::$COMMENTER has no write access to $GITHUB_REPOSITORY"
            exit 1
          fi
          pull_request="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST")"
          if [[ "$(jq -r .head.repo.full_name <<< "$pull_request")" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::The pull request's branch is not in $GITHUB_REPOSITORY"
            exit 1
          fi
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT/reactions" -f content=eyes
          {
            echo "source=$(jq -r .head.sha <<< "$pull_request")"
            echo "destination=origin/$(jq -r .base.ref <<< "$pull_request")"
            echo "target=$(jq -r .base.ref <<< "$pull_request")"
            echo "pull_request=$PULL_REQUEST"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.revisions.outputs.source }}
          fetch-depth: 0
          # The benchmark runs the branch's code, which gets no token.
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Benchmark
        id: benchmark
        env:
          COLUMNS: 200
          COMMAND: ${{ github.event.comment.body }}
          DESTINATION: ${{ steps.revisions.outputs.destination }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MERGE_BENCH_RESULTS: ${{ runner.temp }}/merge-bench
          PREFECT_API_URL: ${{ vars.PREFECT_API_URL }}
          PREFECT_BASIC_CREDENTIAL: ${{ secrets.PREFECT_API_KEY }}
          # Errors as plain text, for the reports.
          TYPER_USE_RICH: 0
        run: |
          PREFECT_API_AUTH_STRING="$(base64 --decode <<< "$PREFECT_BASIC_CREDENTIAL")"
          export PREFECT_API_AUTH_STRING
          # xargs splits the arguments without running a shell.
          xargs scripts/benchmarks/merge_bench.sh "$DESTINATION" <<< "${COMMAND#!bench}" 2>&1 \
            | tee "$RUNNER_TEMP/merge-bench.txt"

      - name: Report
        if: ${{ !cancelled() && steps.benchmark.outcome != 'skipped' }}
        env:
          COMMITS: ${{ github.server_url }}/${{ github.repository }}/commit
          DESTINATION: ${{ steps.revisions.outputs.destination }}
          MERGE_BENCH_RESULTS: ${{ runner.temp }}/merge-bench
          SOURCE: ${{ steps.revisions.outputs.source }}
          TARGET: ${{ steps.revisions.outputs.target }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          fork_point="$(git merge-base "$DESTINATION" HEAD)"
          {
            echo "Benchmark of [\`${SOURCE::8}\`]($COMMITS/$SOURCE) against [\`${fork_point::8}\`]($COMMITS/$fork_point)," \
              "where it forked from \`$TARGET\` ([log]($WORKFLOW_RUN))"
            echo
            if [[ -f "$MERGE_BENCH_RESULTS/head.json" ]]; then
              uv run --project scripts/benchmarks/benchman --frozen python scripts/benchmarks/results_table.py \
                "$MERGE_BENCH_RESULTS/head.json" --base "$MERGE_BENCH_RESULTS/base.json"
            else
              # Not measured, or an error before any result: the end of the output says why.
              echo '```'
              tail -n 20 "$RUNNER_TEMP/merge-bench.txt"
              echo '```'
            fi
          } > "$RUNNER_TEMP/merge-bench.md"
          cat "$RUNNER_TEMP/merge-bench.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: ${{ !cancelled() && steps.benchmark.outcome != 'skipped' && steps.revisions.outputs.pull_request }}
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.revisions.outputs.pull_request }}
        run: gh pr comment "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/merge-bench.md"

      - name: Report to Discord
        if: ${{ !cancelled() && github.event_name == 'push' && steps.benchmark.outcome != 'skipped' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_BENCHMARK_CHANNEL_WEBHOOK_URL }}
          MERGE_BENCH_RESULTS: ${{ runner.temp }}/merge-bench
          PULL_REQUEST: ${{ steps.revisions.outputs.pull_request }}
          WORKFLOW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Discord has no tables and 2000 characters for a message.
          if [[ -f "$MERGE_BENCH_RESULTS/head.json" ]]; then
            table="$(uv run --project scripts/benchmarks/benchman --frozen python scripts/benchmarks/results_table.py \
              "$MERGE_BENCH_RESULTS/head.json" --base "$MERGE_BENCH_RESULTS/base.json" --text)"
          else
            table="$(tail -n 20 "$RUNNER_TEMP/merge-bench.txt" | tail -c 1500)"
          fi
          # The pull request that the commit merged, or without one the commit.
          merged="commit/$GITHUB_SHA"
          if [[ -n "$PULL_REQUEST" ]]; then
            merged="pull/$PULL_REQUEST"
          fi
          jq -n \
            --arg merged "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/$merged" \
            --arg run "$WORKFLOW_RUN" \
            --arg table "$table" \
            --arg title "$(git log -1 --format=%s)" \
            '{
              allowed_mentions: {parse: []},
              content: "Merge benchmark of [\($title)](<\($merged)>) ([log](<\($run)>))\n```\n\($table)\n```"
            }' |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --header "Content-Type: application/json" \
            --data-binary @- \
            "$DISCORD_WEBHOOK_URL"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.benchmark.outcome != 'skipped' }}
        with:
          name: merge-bench
          path: |
            ${{ runner.temp }}/merge-bench.md
            ${{ runner.temp }}/merge-bench
