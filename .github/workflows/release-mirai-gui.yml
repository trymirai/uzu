name: "Release mirai-gui"

# The app ships with every engine release under the engine's version.
on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-mirai-gui
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  decide:
    name: decide
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.decide.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.MIRAI_CHAT_GOOGLE_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: decide
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUCKET: ${{ vars.MIRAI_CHAT_BUCKET_NAME }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${TAG} is not an engine release tag; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${TAG}"
          if [ -z "${BUCKET}" ]; then
            echo "MIRAI_CHAT_BUCKET_NAME var is not configured" >&2
            exit 1
          fi
          # The release event does not say which branch the tag is on.
          STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${TAG}" --jq .status)"
          if [ "${STATUS}" != "identical" ] && [ "${STATUS}" != "behind" ]; then
            echo "Tag ${TAG} is not on main (compare status: ${STATUS})" >&2
            exit 1
          fi
          STAMPED="$(node -p "require('./apps/mirai-gui/package.json').version")"
          if [ "${STAMPED}" != "${VERSION}" ]; then
            echo "apps/mirai-gui/package.json is at ${STAMPED}, tag is ${VERSION}: cargo tools sync did not run before tagging" >&2
            exit 1
          fi
          gcloud auth activate-service-account --key-file="${GOOGLE_GHA_CREDS_PATH}"
          FEED="gs://${BUCKET}/update-feed/tauri/latest.json"
          if FEED_JSON="$(gsutil cat "${FEED}" 2>"${RUNNER_TEMP}/feed.err")"; then
            PUBLISHED="$(printf '%s' "${FEED_JSON}" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          elif grep -qE "No URLs matched" "${RUNNER_TEMP}/feed.err"; then
            PUBLISHED=""
          else
            cat "${RUNNER_TEMP}/feed.err" >&2
            exit 1
          fi
          if [ -n "${PUBLISHED}" ]; then
            HIGHEST="$(printf '%s\n%s\n' "${PUBLISHED}" "${VERSION}" | sort -V | tail -n 1)"
            if [ "${VERSION}" = "${PUBLISHED}" ]; then
              echo "::notice::${VERSION} is already published; nothing to do"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${HIGHEST}" != "${VERSION}" ]; then
              echo "Feed already advertises ${PUBLISHED}, newer than ${VERSION}" >&2
              exit 1
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  release:
    name: release-mirai-gui
    needs: decide
    if: ${{ needs.decide.outputs.publish == 'true' }}
    runs-on: macos-26

    defaults:
      run:
        working-directory: apps/mirai-gui

    env:
      TAG: ${{ github.event.release.tag_name }}
      VERSION: ${{ needs.decide.outputs.version }}
      MIRAI_TITLE: ${{ vars.MIRAI_TITLE || 'mirai' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Unset makes the signer prompt for a password.
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      # Compiled into the binary.
      MIRAI_CHAT_BUCKET_NAME: ${{ vars.MIRAI_CHAT_BUCKET_NAME }}/update-feed/tauri
      APP_UPDATE_CREDENTIALS: ${{ secrets.APP_UPDATE_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          metal: true
          bindings: true

      - name: Verify required secrets
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY secret is not configured" >&2
            exit 1
          fi
          if [ -z "${{ vars.MIRAI_CHAT_BUCKET_NAME }}" ]; then
            echo "MIRAI_CHAT_BUCKET_NAME secret is not configured" >&2
            exit 1
          fi
          if [ -z "${APP_UPDATE_CREDENTIALS}" ]; then
            echo "APP_UPDATE_CREDENTIALS secret is not configured" >&2
            exit 1
          fi
          # Decoded as updater/gcs.rs does; a wrapped secret would fail only in the shipped build.
          if ! printf '%s' "${APP_UPDATE_CREDENTIALS}" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const t=s.trim();if(/[\r\n]/.test(t))process.exit(1);const j=JSON.parse(Buffer.from(t,"base64").toString("utf8"));for(const k of ["client_email","private_key","token_uri"])if(!j[k])process.exit(1);})'; then
            echo "APP_UPDATE_CREDENTIALS must be single-line base64 of SA JSON with client_email/private_key/token_uri (no line breaks; use base64 -w0)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the mirai CLI from this tree
        working-directory: .
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET="$(awk -F'"' '/^MACOSX_DEPLOYMENT_TARGET/{print $2}' .config/platforms.toml)"
          cargo build -p cli --release --target aarch64-apple-darwin \
            --no-default-features --features backend-metal,capability-grammar
          rm -rf apps/mirai-gui/src-tauri/resources/cli
          mkdir -p apps/mirai-gui/src-tauri/resources/cli
          cp target/aarch64-apple-darwin/release/cli apps/mirai-gui/src-tauri/resources/cli/mirai
          chmod 755 apps/mirai-gui/src-tauri/resources/cli/mirai

      - name: Import signing certificate and read its identity
        run: |
          set -euo pipefail
          # Tauri takes the identity as a string, not a p12.
          KEYCHAIN="${RUNNER_TEMP}/mirai-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "${{ secrets.APPLE_DEVELOPER_ID_P12 }}" | base64 -D > "${RUNNER_TEMP}/app_cert.p12"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          # No lock timeout: codesign runs at the end of a long build.
          security set-keychain-settings "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security import "${RUNNER_TEMP}/app_cert.p12" -k "${KEYCHAIN}" \
            -P "${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN}" | grep -m1 'Developer ID Application' | awk -F'"' '{print $2}')"
          if [ -z "${IDENTITY}" ]; then
            echo "No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/app_cert.p12"
          echo "APPLE_SIGNING_IDENTITY=${IDENTITY}" >> $GITHUB_ENV
          echo "::add-mask::${IDENTITY}"

      - name: Sign and verify the bundled CLI
        run: |
          set -euo pipefail
          # tauri-bundler does not sign binaries under Resources.
          CLI="src-tauri/resources/cli/mirai"
          codesign --force --options runtime --timestamp \
            --sign "${APPLE_SIGNING_IDENTITY}" "${CLI}"
          codesign --verify --strict --verbose=2 "${CLI}"

      - name: Build and sign Tauri app
        run: |
          set -euo pipefail
          # Only the .app: on CI tauri skips its DMG styling (tauri-apps/tauri#1731),
          # so dmgbuild makes the DMG below.
          pnpm build --bundles app --config src-tauri/tauri.release.conf.json 2>&1 | tee build.log
          if grep -qi "does not match the public key\|won't be accepted at runtime" build.log; then
            echo "Tauri updater signing key does not match the configured pubkey" >&2
            exit 1
          fi

      - name: Build DMG (headless, dmgbuild)
        run: |
          set -euo pipefail
          # The runner's python3 refuses pip install outside a venv.
          VENV_DIR="${RUNNER_TEMP}/dmgbuild-venv"
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/pip" install --quiet dmgbuild
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_PATH="$(ls -1dt "${BUNDLE_DIR}/macos/"*.app 2>/dev/null | head -n 1 || true)"
          mkdir -p "${BUNDLE_DIR}/dmg"
          DMG_OUT="${BUNDLE_DIR}/dmg/${MIRAI_TITLE}-${VERSION}.dmg"
          DMG_APP_PATH="${APP_PATH}" \
          DMG_BACKGROUND="${PWD}/src-tauri/dmg-background.tiff" \
            "${VENV_DIR}/bin/python" -m dmgbuild -s src-tauri/dmg-settings.py "Mirai" "${DMG_OUT}"

      - name: Locate and notarize artifacts
        run: |
          set -euo pipefail
          BUNDLE_DIR="${PWD}/src-tauri/target/aarch64-apple-darwin/release/bundle"
          DMG_PATH="$(ls -1t "${BUNDLE_DIR}/dmg/"*.dmg 2>/dev/null | head -n 1 || true)"
          APP_PATH="$(ls -1dt "${BUNDLE_DIR}/macos/"*.app 2>/dev/null | head -n 1 || true)"
          TARGZ_PATH="$(ls -1t "${BUNDLE_DIR}/macos/"*.app.tar.gz 2>/dev/null | head -n 1 || true)"
          SIG_PATH="$(ls -1t "${BUNDLE_DIR}/macos/"*.app.tar.gz.sig 2>/dev/null | head -n 1 || true)"
          for p in "${DMG_PATH}" "${APP_PATH}" "${TARGZ_PATH}" "${SIG_PATH}"; do
            if [ -z "${p}" ] || [ ! -e "${p}" ]; then
              echo "Missing expected bundle artifact: ${p:-<unset>}" >&2
              ls -laR "${BUNDLE_DIR}" || true
              exit 1
            fi
          done
          # The updater tarball is checked by its .sig, not by Gatekeeper.
          xcrun notarytool submit "${DMG_PATH}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_PASSWORD}" \
            --wait
          xcrun stapler staple -v "${DMG_PATH}"
          DMG_TARGET="${BUNDLE_DIR}/dmg/${MIRAI_TITLE}-${VERSION}-arm64.dmg"
          mv -f "${DMG_PATH}" "${DMG_TARGET}"
          echo "DMG_TARGET=${DMG_TARGET}" >> $GITHUB_ENV
          echo "APP_PATH=${APP_PATH}" >> $GITHUB_ENV
          echo "TARGZ_PATH=${TARGZ_PATH}" >> $GITHUB_ENV
          echo "SIG_PATH=${SIG_PATH}" >> $GITHUB_ENV

      - name: Verify crossover identity (bundle id + team)
        run: |
          set -euo pipefail
          IDENT="$(codesign -dv "${APP_PATH}" 2>&1 | awk -F= '/^Identifier=/{print $2}')"
          if [ "${IDENT}" != "com.mirai.tech.chat" ]; then
            echo "Built app identifier '${IDENT}' != com.mirai.tech.chat, crossover would break" >&2
            exit 1
          fi
          TEAM="$(codesign -dv "${APP_PATH}" 2>&1 | awk -F= '/^TeamIdentifier=/{print $2}')"
          if [ "${TEAM}" != "${APPLE_TEAM_ID}" ]; then
            echo "Built app team '${TEAM}' != '${APPLE_TEAM_ID}', crossover would break" >&2
            exit 1
          fi
          BUILT="$(defaults read "${APP_PATH}/Contents/Info" CFBundleShortVersionString)"
          if [ "${BUILT}" != "${VERSION}" ]; then
            echo "Built app is ${BUILT}, feeds would say ${VERSION}: every client would update forever" >&2
            exit 1
          fi
          # Installed /usr/local/bin wrappers point at this path.
          if [ ! -x "${APP_PATH}/Contents/Resources/cli/mirai" ]; then
            echo "CLI missing from bundle at ${APP_PATH}/Contents/Resources/cli/mirai" >&2
            exit 1
          fi

      - name: Build the electron-updater artifacts
        run: |
          set -euo pipefail
          # Installed Electron clients update only from latest-mac.yml + zip.
          ZIP_NAME="${MIRAI_TITLE}-${VERSION}-mac.zip"
          ditto -c -k --sequesterRsrc --keepParent "${APP_PATH}" "${ZIP_NAME}"
          ZIP_SIZE="$(stat -f%z "${ZIP_NAME}")"
          ZIP_SHA512="$(openssl dgst -sha512 -binary "${ZIP_NAME}" | openssl base64 -A)"
          RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          cat > latest-mac.yml <<EOF
          version: ${VERSION}
          files:
            - url: ${ZIP_NAME}
              sha512: ${ZIP_SHA512}
              size: ${ZIP_SIZE}
          path: ${ZIP_NAME}
          sha512: ${ZIP_SHA512}
          releaseDate: '${RELEASE_DATE}'
          EOF
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Build the Tauri updater manifest
        run: |
          set -euo pipefail
          TARGZ_NAME="${MIRAI_TITLE}-${VERSION}.app.tar.gz"
          cp "${TARGZ_PATH}" "${TARGZ_NAME}"
          cp "${SIG_PATH}" "${TARGZ_NAME}.sig"
          SIGNATURE="$(cat "${TARGZ_NAME}.sig")"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${SIGNATURE}",
                "url": "https://storage.googleapis.com/${{ vars.MIRAI_CHAT_BUCKET_NAME }}/update-feed/tauri/${TARGZ_NAME}"
              }
            }
          }
          EOF
          echo "TARGZ_NAME=${TARGZ_NAME}" >> $GITHUB_ENV

      - name: Upload macOS artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DMG_TARGET }}
            apps/mirai-gui/${{ env.ZIP_NAME }}
            apps/mirai-gui/${{ env.TARGZ_NAME }}
            apps/mirai-gui/${{ env.TARGZ_NAME }}.sig
            apps/mirai-gui/latest-mac.yml
            apps/mirai-gui/latest.json
          tag_name: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true

      - name: Verify assets bucket secrets are configured
        run: |
          if [ -z "${{ vars.ASSETS_BUCKET_NAME }}" ]; then
            echo "ASSETS_BUCKET_NAME var is not configured" >&2
            exit 1
          fi
          if [ -z "${{ secrets.ASSETS_GOOGLE_CREDENTIALS }}" ]; then
            echo "ASSETS_GOOGLE_CREDENTIALS secret is not configured" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud (assets bucket)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.ASSETS_GOOGLE_CREDENTIALS }}

      - name: Setup gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload versioned DMG to assets bucket
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="${GOOGLE_GHA_CREDS_PATH}"
          # The website lists app/ and serves the highest mirai-<version>-<platform>.dmg.
          GCS_OBJECT="${MIRAI_TITLE}-${VERSION}-aarch64-apple-darwin.dmg"
          # -n: the CDN caches this URL for a year.
          gsutil cp -n "${DMG_TARGET}" "gs://${{ vars.ASSETS_BUCKET_NAME }}/app/${GCS_OBJECT}"

      # gsutil has used the previous account's leftover credentials before.
      - name: Reset gcloud authentication
        run: |
          rm -f "$HOME/.config/gcloud/application_default_credentials.json"
          gcloud auth revoke --all || true

      - name: Authenticate to Google Cloud (mirai-chat bucket)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.MIRAI_CHAT_GOOGLE_CREDENTIALS }}

      # Archives first: a manifest starts downloads of everything it names.
      - name: Publish update artifacts and feeds
        env:
          DEST_BUCKET: gs://${{ vars.MIRAI_CHAT_BUCKET_NAME }}
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="${GOOGLE_GHA_CREDS_PATH}"
          if FEED_YML="$(gsutil cat "${DEST_BUCKET}/latest-mac.yml" 2>"${RUNNER_TEMP}/feed.err")"; then
            PUBLISHED="$(printf '%s\n' "${FEED_YML}" | awk '/^version:/{print $2; exit}')"
          elif grep -qE "No URLs matched" "${RUNNER_TEMP}/feed.err"; then
            PUBLISHED=""
          else
            cat "${RUNNER_TEMP}/feed.err" >&2
            exit 1
          fi
          if [ -n "${PUBLISHED}" ]; then
            HIGHEST="$(printf '%s\n%s\n' "${PUBLISHED}" "${VERSION}" | sort -V | tail -n 1)"
            if [ "${VERSION}" != "${PUBLISHED}" ] && [ "${HIGHEST}" != "${VERSION}" ]; then
              echo "Feed already advertises ${PUBLISHED}, newer than ${VERSION}" >&2
              exit 1
            fi
          fi
          # Manifests carry this build's hashes; an earlier run's archive stays only if identical.
          publish_archive() {
            local file="$1" uri="$2"
            local local_md5 remote_md5
            local_md5="$(gsutil hash -m "${file}" | awk '/md5/{print $NF}')"
            remote_md5="$(gsutil stat "${uri}" 2>/dev/null | awk '/Hash \(md5\)/{print $NF}' || true)"
            if [ -n "${remote_md5}" ] && [ "${remote_md5}" = "${local_md5}" ]; then
              echo "${uri} already holds these bytes"
              return
            fi
            gsutil cp "${file}" "${uri}"
          }
          publish_archive "${ZIP_NAME}" "${DEST_BUCKET}/${ZIP_NAME}"
          publish_archive "${TARGZ_NAME}" "${DEST_BUCKET}/update-feed/tauri/${TARGZ_NAME}"
          publish_archive "${TARGZ_NAME}.sig" "${DEST_BUCKET}/update-feed/tauri/${TARGZ_NAME}.sig"
          # Always rewritten: a re-run's archives are not the earlier run's bytes.
          gsutil -h "Content-Type: text/yaml" cp latest-mac.yml "${DEST_BUCKET}/latest-mac.yml"
          gsutil -h "Content-Type: application/json" cp latest.json "${DEST_BUCKET}/update-feed/tauri/latest.json"
