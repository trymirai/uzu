name: "Build / release mirai-gui"

# The app ships with every engine release under the engine's version, stamped
# by `cargo tools sync`; the engine's GitHub Release is also the update feed.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: mirai-gui-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  decide:
    name: decide
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      version: ${{ steps.decide.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - id: decide
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAMPED="$(node -p "require('./apps/mirai-gui/package.json').version")"
          echo "version=${STAMPED}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${TAG} is not an engine release tag; nothing to publish"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${STAMPED}" != "${TAG}" ]; then
            echo "apps/mirai-gui/package.json is at ${STAMPED}, tag is ${TAG}: cargo tools sync did not run before tagging" >&2
            exit 1
          fi
          # latest.json is attached after every other asset.
          ASSETS="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
          if grep -qxF latest.json <<< "${ASSETS}"; then
            echo "::notice::${TAG} already carries the app; nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build signed macOS app
    needs: decide
    if: ${{ needs.decide.outputs.build == 'true' }}
    runs-on: macos-26
    outputs:
      artifact-id: ${{ steps.artifacts.outputs.artifact-id }}

    defaults:
      run:
        working-directory: apps/mirai-gui

    env:
      TAG: ${{ github.event.release.tag_name }}
      APP_VERSION: ${{ needs.decide.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      # Unset makes the signer prompt for a password.
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          metal: true
          bindings: true

      # Fail here, not after the twenty-minute build.
      - name: Verify secrets and variables are configured
        run: |
          for v in TAURI_SIGNING_PRIVATE_KEY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                   APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_PASSWORD; do
            test -n "${!v}" || { echo "${v} is not configured" >&2; exit 1; }
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Already signed and notarized by the engine's release job; Tauri leaves
      # files under Resources unsigned.
      - name: Take the mirai CLI from the engine release
        if: ${{ github.event_name == 'release' }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --dir "${RUNNER_TEMP}" --pattern mirai-aarch64-apple-darwin.tar.gz
          tar -xzf "${RUNNER_TEMP}/mirai-aarch64-apple-darwin.tar.gz" -C "${RUNNER_TEMP}"
          install -d desktop/resources/cli
          install -m 755 "${RUNNER_TEMP}/mirai-aarch64-apple-darwin" desktop/resources/cli/mirai
          codesign --verify --strict --verbose=2 \
            -R="anchor apple generic and certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\"" \
            desktop/resources/cli/mirai

      - name: Build the mirai CLI from the selected commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: .
        run: |
          set -euo pipefail
          uv run --no-project --python 3.12 python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path('.config/platforms.toml').read_text())
          target = 'aarch64-apple-darwin'
          platform = config['targets'][target]
          features = [f"backend-{platform['backend']}"]
          features += [f'capability-{cap}' for cap in platform['capabilities_default']]
          env = os.environ | {key: config['envs'][key] for key in platform['required_envs']}
          subprocess.run([
              'cargo', 'build', '--locked', '--release', '-p', config['binaries']['mirai']['crate'],
              '--target', target, '--no-default-features', '--features', ','.join(features),
          ], env=env, check=True)
          PY
          install -d apps/mirai-gui/desktop/resources/cli
          install -m 755 target/aarch64-apple-darwin/release/cli apps/mirai-gui/desktop/resources/cli/mirai

      - name: Import signing certificate and read its identity
        run: |
          set -euo pipefail
          # Tauri's own import prints the identity in the log.
          KEYCHAIN="${RUNNER_TEMP}/mirai-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          printf '%s' "${APPLE_DEVELOPER_ID_P12}" | base64 -d > "${RUNNER_TEMP}/app_cert.p12"
          security create-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          # The keychain must stay unlocked through the whole build.
          security set-keychain-settings "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PW}" "${KEYCHAIN}"
          security import "${RUNNER_TEMP}/app_cert.p12" -k "${KEYCHAIN}" \
            -P "${APPLE_DEVELOPER_ID_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PW}" "${KEYCHAIN}" >/dev/null
          KEYCHAINS=()
          while IFS='"' read -r _ EXISTING_KEYCHAIN _; do
            KEYCHAINS+=("${EXISTING_KEYCHAIN}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${KEYCHAIN}" "${KEYCHAINS[@]}"
          IDENTITY="$(security find-identity -v -p codesigning "${KEYCHAIN}" | grep -m1 'Developer ID Application' | awk -F'"' '{print $2}')"
          if [ -z "${IDENTITY}" ]; then
            echo "No Developer ID Application identity found in the imported certificate" >&2
            exit 1
          fi
          rm -f "${RUNNER_TEMP}/app_cert.p12"
          echo "APPLE_SIGNING_IDENTITY=${IDENTITY}" >> "$GITHUB_ENV"
          echo "::add-mask::${IDENTITY}"

      - name: Sign and notarize the locally built CLI
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --sign "${APPLE_SIGNING_IDENTITY}" desktop/resources/cli/mirai
          codesign --verify --strict --verbose=2 \
            -R="anchor apple generic and certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\"" \
            desktop/resources/cli/mirai
          ditto -c -k --sequesterRsrc --keepParent desktop/resources/cli/mirai "${RUNNER_TEMP}/mirai-cli.zip"
          xcrun notarytool submit "${RUNNER_TEMP}/mirai-cli.zip" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" --password "${APPLE_PASSWORD}" --wait

      - name: Build and sign Tauri app
        run: |
          set -euo pipefail
          # Only the .app: Tauri cannot style the DMG on CI (tauri-apps/tauri#1731).
          pnpm build --bundles app --config desktop/tauri.release.conf.json

      - name: Build DMG (headless, dmgbuild)
        run: |
          set -euo pipefail
          # The runner's python3 refuses pip install outside a venv.
          VENV_DIR="${RUNNER_TEMP}/dmgbuild-venv"
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/pip" install --quiet dmgbuild
          BUNDLE_DIR="${PWD}/desktop/target/aarch64-apple-darwin/release/bundle"
          PRODUCT="$(node -p "require('./desktop/tauri.conf.json').productName")"
          APP_PATH="${BUNDLE_DIR}/macos/${PRODUCT}.app"
          for p in "${APP_PATH}" "${APP_PATH}.tar.gz" "${APP_PATH}.tar.gz.sig"; do
            test -e "${p}" || { echo "Missing bundle artifact: ${p}" >&2; ls -la "${BUNDLE_DIR}/macos" >&2; exit 1; }
          done
          # public.api matches ^mirai-<version>-aarch64-apple-darwin.dmg$ exactly.
          DMG_NAME="mirai-${APP_VERSION}-aarch64-apple-darwin.dmg"
          DMG_TARGET="${BUNDLE_DIR}/dmg/${DMG_NAME}"
          mkdir -p "${BUNDLE_DIR}/dmg"
          DMG_APP_PATH="${APP_PATH}" \
          DMG_BACKGROUND="${PWD}/desktop/dmg-background.tiff" \
            "${VENV_DIR}/bin/python" -m dmgbuild -s desktop/dmg-settings.py "${PRODUCT}" "${DMG_TARGET}"
          {
            echo "APP_PATH=${APP_PATH}"
            echo "TARGZ_PATH=${APP_PATH}.tar.gz"
            echo "SIG_PATH=${APP_PATH}.tar.gz.sig"
            echo "DMG_TARGET=${DMG_TARGET}"
          } >> "$GITHUB_ENV"

      - name: Verify the built app
        run: |
          set -euo pipefail
          # Tauri only warns when the signing key does not match the pubkey.
          brew install --quiet minisign
          node -p "require('./desktop/tauri.conf.json').plugins.updater.pubkey" | base64 -d > "${RUNNER_TEMP}/updater.pub"
          base64 -d < "${SIG_PATH}" > "${RUNNER_TEMP}/updater.minisig"
          minisign -Vm "${TARGZ_PATH}" -p "${RUNNER_TEMP}/updater.pub" -x "${RUNNER_TEMP}/updater.minisig"
          BUILT="$(defaults read "${APP_PATH}/Contents/Info" CFBundleShortVersionString)"
          if [ "${BUILT}" != "${APP_VERSION}" ]; then
            echo "Built app is ${BUILT}, expected ${APP_VERSION}" >&2
            exit 1
          fi
          # Installed /usr/local/bin wrappers point at this path.
          if [ ! -x "${APP_PATH}/Contents/Resources/cli/mirai" ]; then
            echo "CLI missing from bundle at ${APP_PATH}/Contents/Resources/cli/mirai" >&2
            exit 1
          fi

      - name: Notarize the DMG
        run: |
          set -euo pipefail
          # Tauri notarized the .app; the DMG was built outside Tauri.
          xcrun notarytool submit "${DMG_TARGET}" \
            --apple-id "${APPLE_ID}" \
            --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_PASSWORD}" \
            --wait
          xcrun stapler staple -v "${DMG_TARGET}"

      - name: Stage downloadable app artifacts
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/mirai-gui-artifacts"
          cp "${DMG_TARGET}" "${RUNNER_TEMP}/mirai-gui-artifacts/"
          cp "${TARGZ_PATH}" "${RUNNER_TEMP}/mirai-gui-artifacts/mirai-${APP_VERSION}.app.tar.gz"
          cp "${SIG_PATH}" "${RUNNER_TEMP}/mirai-gui-artifacts/mirai-${APP_VERSION}.app.tar.gz.sig"

      - uses: actions/upload-artifact@v4
        id: artifacts
        with:
          name: mirai-macos-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mirai-gui-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove signing credentials
        if: ${{ always() }}
        run: |
          rm -f "${RUNNER_TEMP}/app_cert.p12"
          if [ -f "${RUNNER_TEMP}/mirai-signing.keychain-db" ]; then
            security delete-keychain "${RUNNER_TEMP}/mirai-signing.keychain-db"
          fi

  publish:
    name: Publish release assets
    needs: [decide, build]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      DMG_TARGET: mirai-${{ needs.decide.outputs.version }}-aarch64-apple-darwin.dmg
      TARGZ_NAME: mirai-${{ needs.decide.outputs.version }}.app.tar.gz

    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true

      - name: Build the updater manifest
        run: |
          set -euo pipefail
          jq -n \
            --arg version "${TAG}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg signature "$(cat "${TARGZ_NAME}.sig")" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${TARGZ_NAME}" \
            '{version: $version, pub_date: $pub_date, platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > latest.json

      # Clients read latest.json as soon as it is attached.
      - name: Attach the release assets
        run: |
          set -euo pipefail
          ASSETS="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
          if grep -qxF latest.json <<< "${ASSETS}"; then
            echo "${TAG} is already published; re-run all jobs, not failed ones, to rebuild" >&2
            exit 1
          fi
          gh release upload "${TAG}" --clobber "${DMG_TARGET}" "${TARGZ_NAME}" "${TARGZ_NAME}.sig"
          gh release upload "${TAG}" --clobber latest.json

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.ASSETS_GOOGLE_CREDENTIALS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Upload the DMG to the website bucket
        run: |
          set -euo pipefail
          gsutil cp -n "${DMG_TARGET}" "gs://${{ vars.ASSETS_BUCKET_NAME }}/app/$(basename "${DMG_TARGET}")"
