name: "Release (build only)"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use for local build artifacts"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macs-fleet-low
    env:
      VERSION: ${{ inputs.version }}
      HOMEBREW_NO_ANALYTICS: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          metal: true
          bindings: true
          uv-cache: false

      - name: "Binaries: Import developer identity certificate"
        shell: bash
        env:
          TEAM_ID: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
        run: |
          set -euo pipefail
          CERT_P12="$RUNNER_TEMP/dev_id_app.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD=""

          echo "${{ secrets.APPLE_DEVELOPER_ID_P12 }}" | base64 -D > "$CERT_P12"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$KEYCHAIN_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          existing_keychains=("$KEYCHAIN_PATH")
          while IFS= read -r existing_keychain; do
            existing_keychain=$(printf '%s\n' "$existing_keychain" | sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
            if [ -n "$existing_keychain" ] && [ "$existing_keychain" != "$KEYCHAIN_PATH" ]; then
              existing_keychains+=("$existing_keychain")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${existing_keychains[@]}"

          security import "$CERT_P12" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}" \
            -T /usr/bin/codesign

          if ! security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null 2>&1; then
            echo "Unable to set key partition list for imported signing identity" >&2
            exit 1
          fi

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application:' \
            | grep "(${TEAM_ID})" \
            | sed -nE 's/.*"(.*)".*/\1/p' \
            | head -n1 || true)
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "Imported keychain does not contain a valid Developer ID Application identity for team $TEAM_ID" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" || true
            exit 1
          fi

          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: "Release: Install tools"
        run: |
          cargo tools setup
          cargo tools install rust
          cargo tools install python
          cargo tools install swift
          cargo tools install typescript

      - name: "Release: Sync"
        run: cargo tools sync

      - name: "Release: Create staging directory"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          release_path=$(mktemp -d "$GITHUB_WORKSPACE/.tmp/uzu-release.XXXXXX")
          echo "UZU_RELEASE_PATH=$release_path" >> "$GITHUB_ENV"

      - name: "Release: Build artifacts"
        run: cargo tools release "${VERSION}" "$UZU_RELEASE_PATH"

      - name: "Binaries: Codesign"
        shell: bash
        run: |
          set -euo pipefail

          security unlock-keychain -p "" "$SIGNING_KEYCHAIN_PATH"

          signed=0
          while IFS= read -r -d '' binary_path; do
            chmod +x "$binary_path"
            codesign --force --options runtime --timestamp=none \
              --sign "$SIGNING_IDENTITY" \
              "$binary_path"
            codesign --verify --strict --verbose=2 "$binary_path"
            signed=$((signed + 1))
          done < <(find "$UZU_RELEASE_PATH/binaries" \
            -type f \
            ! -name '.DS_Store' \
            ! -name '*.zip' \
            ! -name '*.tar.gz' \
            -print0)

          if [ "$signed" -eq 0 ]; then
            echo "No binaries found under $UZU_RELEASE_PATH/binaries" >&2
            exit 1
          fi

      - name: "Binaries: Package"
        shell: bash
        run: |
          set -euo pipefail

          zip_root="$UZU_RELEASE_PATH/notarization"
          mkdir -p "$zip_root"

          packaged=0
          while IFS= read -r -d '' binary_path; do
            binary_dir=$(dirname "$binary_path")
            artifact_name=$(basename "$binary_path")
            zip_path="$zip_root/${artifact_name}.zip"
            tarball_path="$binary_dir/${artifact_name}.tar.gz"

            rm -f "$zip_path" "$tarball_path"
            ditto -c -k --sequesterRsrc --keepParent "$binary_path" "$zip_path"
            tar -czf "$tarball_path" -C "$binary_dir" "$artifact_name"
            packaged=$((packaged + 1))
          done < <(find "$UZU_RELEASE_PATH/binaries" \
            -type f \
            ! -name '.DS_Store' \
            ! -name '*.zip' \
            ! -name '*.tar.gz' \
            -print0)

          if [ "$packaged" -eq 0 ]; then
            echo "No binaries found under $UZU_RELEASE_PATH/binaries" >&2
            exit 1
          fi

      - name: "Release: List build artifacts"
        run: find "$UZU_RELEASE_PATH" -type f

      - name: "Binaries: Clean up developer identity"
        if: ${{ always() }}
        run: |
          cleanup_status=0
          if [ -f "$RUNNER_TEMP/release-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db" || cleanup_status=1
          fi
          rm -f "$RUNNER_TEMP/dev_id_app.p12" || cleanup_status=1
          exit "$cleanup_status"
