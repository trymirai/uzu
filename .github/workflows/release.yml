name: "Release (build only)"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to use for local build artifacts"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: macs-fleet-low
    env:
      VERSION: ${{ inputs.version }}
      HOMEBREW_NO_ANALYTICS: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          metal: true
          bindings: true
          uv-cache: false

      - name: "Release: Install tools"
        run: |
          cargo tools setup
          cargo tools install rust
          cargo tools install python
          cargo tools install swift
          cargo tools install typescript

      - name: "Release: Sync"
        run: cargo tools sync

      - name: "Release: Create staging directory"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp"
          release_path=$(mktemp -d "$GITHUB_WORKSPACE/.tmp/uzu-release.XXXXXX")
          echo "UZU_RELEASE_PATH=$release_path" >> "$GITHUB_ENV"

      - name: "Release: Build artifacts"
        run: cargo tools release "${VERSION}" "$UZU_RELEASE_PATH"

      - name: "Binaries: Package"
        shell: bash
        run: |
          set -euo pipefail

          zip_root="$UZU_RELEASE_PATH/notarization"
          mkdir -p "$zip_root"

          packaged=0
          while IFS= read -r -d '' binary_path; do
            binary_dir=$(dirname "$binary_path")
            artifact_name=$(basename "$binary_path")
            zip_path="$zip_root/${artifact_name}.zip"
            tarball_path="$binary_dir/${artifact_name}.tar.gz"

            rm -f "$zip_path" "$tarball_path"
            ditto -c -k --sequesterRsrc --keepParent "$binary_path" "$zip_path"
            tar -czf "$tarball_path" -C "$binary_dir" "$artifact_name"
            packaged=$((packaged + 1))
          done < <(find "$UZU_RELEASE_PATH/binaries" \
            -type f \
            ! -name '.DS_Store' \
            ! -name '*.zip' \
            ! -name '*.tar.gz' \
            -print0)

          if [ "$packaged" -eq 0 ]; then
            echo "No binaries found under $UZU_RELEASE_PATH/binaries" >&2
            exit 1
          fi

      - name: "Release: List build artifacts"
        run: find "$UZU_RELEASE_PATH" -type f
