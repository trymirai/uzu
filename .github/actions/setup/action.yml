name: setup
description: Setup dependencies

inputs:
  linters:
    description: "Install linters"
    required: false
    default: 'false'
  metal:
    description: "Install metal toolchain"
    required: false
    default: 'false'
  test_data:
    description: "Download test data"
    required: false
    default: 'false'
  nextest:
    description: "Install nextest"
    required: false
    default: 'false'
  target:
    description: "Additional Rust target to install"
    required: false
    default: ''
  bindings:
    description: "Install bindings requirements"
    required: false
    default: 'false'
  node-version:
    description: "Node.js version for bindings and apps"
    required: false
    default: '26'

runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev build-essential pkg-config
      shell: bash

    # - if: runner.os == 'Linux'
    #   run: |
    #     sudo mkdir -p /data/cargo
    #     sudo chown runner:runner /data/cargo

    #     mkdir -p ~/.cargo
    #     rm -rf ~/.cargo/registry && ln -sfn /data/cargo/registry ~/.cargo/registry
    #     rm -rf ~/.cargo/git && ln -sfn /data/cargo/git ~/.cargo/git
    #   shell: bash

    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    - uses: dtolnay/rust-toolchain@nightly
      with:
        targets: ${{ inputs.target }}
        components: ${{ inputs.linters == 'true' && 'rustfmt,clippy' || '' }}

    # Wasmtime 47 removed WASI threads; use the maintained 36.x LTS line.
    - if: inputs.target == 'wasm32-wasip1-threads'
      uses: bytecodealliance/actions/wasmtime/setup@v1
      with:
        version: "36.0.18"

    - if: inputs.linters == 'true'
      run: cargo install --locked cargo-deny
      shell: bash

    - if: inputs.metal == 'true'
      run: xcodebuild -downloadComponent MetalToolchain
      shell: bash

    - if: inputs.nextest == 'true'
      run: cargo install --locked cargo-nextest
      shell: bash

    - if: inputs.bindings == 'true'
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true

    - if: inputs.test_data == 'true'
      run: cargo tools hanashi-tokenizers
      shell: bash

    - if: inputs.bindings == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: "https://registry.npmjs.org"

    - if: inputs.bindings == 'true'
      uses: pnpm/action-setup@v6
      with:
        version: 12.14.0
