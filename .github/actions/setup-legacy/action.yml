name: setup-legacy
description: Set up dependencies without Nix, for macOS release workflows and the Linux and Windows app builds

inputs:
  python:
    description: "Install uv for Python builds and scripts"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@nightly

    - if: runner.os == 'macOS'
      run: xcodebuild -downloadComponent MetalToolchain
      shell: bash

    # The engine's build compiles the Vulkan shaders with Slang's shared library.
    - if: runner.os != 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}" in
          Linux) platform=linux-x86_64-glibc-2.28 ;;
          Windows) platform=windows-x86_64 ;;
        esac
        cd "${RUNNER_TEMP}"
        mkdir slang
        curl -fsSL "https://github.com/shader-slang/slang/releases/download/v2026.22.1/slang-2026.22.1-${platform}.tar.gz" \
          | tar -xz -C slang
        echo "SLANG_DIR=${RUNNER_TEMP}/slang" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=${RUNNER_TEMP}/slang/lib" >> "$GITHUB_ENV"
        echo "${RUNNER_TEMP}/slang/bin" >> "$GITHUB_PATH"

    # The app's webview and the engine's audio output.
    - if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev
      shell: bash

    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true

    - uses: actions/setup-node@v7
      with:
        node-version: '26'
        registry-url: "https://registry.npmjs.org"

    - uses: pnpm/action-setup@v6
      with:
        version: 12.9.0
