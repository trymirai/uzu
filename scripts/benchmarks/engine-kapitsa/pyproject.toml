[project]
name = "benchmarks-kapitsa"
version = "0.0.1"
requires-python = ">=3.13.7"
dependencies = ["benchmarks-common", "typer>=0.27.3"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project.scripts]
engine-kapitsa = "bench_kapitsa:main"

[tool.setuptools]
py-modules = ["bench_kapitsa"]

[tool.uv.sources]
benchmarks-common = { path = "../common-py", editable = true }
