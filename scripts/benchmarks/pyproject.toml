[project]
name = "benchmarks"
version = "0.1.0"
requires-python = ">=3.13.7"
dependencies = [
    "mlx==0.32.2",
    "mlx-lm==0.31.3",
    "mtplx==2.11.3",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
benchmarks = "main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["ruff>=0.16.8", "ty>=0.0.81"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "setup.cfg" },
    { dir = "src" },
    { file = "src/mach/**/*.c" },
    { file = "src/mach/**/*.h" },
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501"]

[tool.setuptools]
py-modules = ["main"]
packages = ["mach"]
package-dir = { "" = "src" }
