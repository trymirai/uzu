[project]
name = "benchmarks"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.13.7"

dependencies = [
    "benchmarks-common",
    "benchmarks-mlx",
    "benchmarks-mtplx",
    "benchmarks-omlx",
    "benchmarks-splash",
    "typer>=0.27.2",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.16.8", "ty>=0.0.84"]

[tool.uv.sources]
benchmarks-common = { workspace = true }
benchmarks-mlx = { workspace = true }
benchmarks-mtplx = { workspace = true }
benchmarks-omlx = { workspace = true }
benchmarks-splash = { workspace = true }

[tool.uv.workspace]
members = [
    "common-py",
    "engine-mlx",
    "engine-mtplx",
    "engine-omlx",
    "engine-splash",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ty.environment]
extra-paths = ["engine-splash/deps"]
