[project]
name = "benchmarks"
version = "0.0.1"
requires-python = ">=3.13.7"

dependencies = ["benchmarks-common", "server"]

[dependency-groups]
dev = ["pytest>=9.2.0", "ruff>=0.17.3", "ty>=0.0.96"]

[tool.uv.sources]
benchmarks-common = { path = "common-py", editable = true }
server = { workspace = true }

[tool.uv.workspace]
members = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["common-py/src"]
markers = [
    "integration: runs real inference engines (opt in with --engine)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["common-py/src/mach/_bindings.py", "engine-splash/splash_bindings.py"]

[tool.ruff.lint]
extend-select = ["E501"]

[tool.ty.environment]
extra-paths = ["engine-splash", "engine-splash/deps"]
