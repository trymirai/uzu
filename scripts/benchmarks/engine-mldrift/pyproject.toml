[project]
name = "benchmarks-mldrift"
version = "0.0.1"
requires-python = ">=3.13.7"
dependencies = [
    "benchmarks-common",
    "numpy>=2.2,<2.3",
    "safetensors>=0.7",
    "torch>=2.9",
    "transformers>=5.14",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
mldrift-prompt-tokens = "prompt_tokens:main"

[tool.setuptools]
py-modules = ["prompt_tokens"]

[tool.uv.sources]
benchmarks-common = { path = "../common-py", editable = true }
