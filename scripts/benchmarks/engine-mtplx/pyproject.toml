[project]
name = "benchmarks-mtplx"
version = "0.0.1"
requires-python = ">=3.13.7"
dependencies = ["benchmarks-common", "mtplx==2.12.0", "typer>=0.27.2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
bench-mtplx = "bench_mtplx:main"

[tool.setuptools]
py-modules = ["bench_mtplx"]

[tool.uv.sources]
benchmarks-common = { path = "../common-py", editable = true }
