[project]
name = "benchmarks-omlx"
version = "0.0.1"
requires-python = ">=3.13.7,<3.14"
dependencies = ["benchmarks-common", "omlx", "typer>=0.27.2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
bench-omlx = "bench_omlx:main"

[tool.setuptools]
py-modules = ["bench_omlx"]

[tool.uv.sources]
benchmarks-common = { path = "../common-py", editable = true }
omlx = { git = "https://github.com/jundot/omlx", tag = "v0.7.0" }
