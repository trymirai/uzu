[project]
name = "benchmarks-common"
version = "0.0.1"
requires-python = ">=3.13.7"
dependencies = [
    "huggingface-hub>=0.36",
    "pydantic>=2.14.2",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["bench", "common", "engine_process", "wsl"]
packages = ["mach"]
package-dir = { "" = "src" }

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/mach/*.c" },
    { file = "../common-cpp/src/*.c" },
    { file = "../common-cpp/src/*.h" },
]
